    <!-- TODO: sostituire con un'immagine OG dedicata (1200x630) quando disponibile;

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ResonaPet",
        "url": "https://www.resonapet.com/"
      }
    </script>
    <link rel="preload" href="/assets/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Added at runtime (not as a static <link>) so Vite's build doesn't
      // rewrite it into a duplicated/hashed copy of the other page.
      (function () {
        var l = document.createElement("link");
        l.rel = "prefetch";
        l.href = "/richiedi-accesso.html";
        document.head.appendChild(l);
      })();
    </script>
    <link
      rel="preload"
      as="image"
      href="/assets/images/hero-dog-desktop-v2.webp"
      imagesrcset="/assets/images/hero-dog-mobile-v2.webp 753w, /assets/images/hero-dog-desktop-v2.webp 1672w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          { "@type": "Question", "name": "Come si svolge il percorso a distanza?", "acceptedAnswer": { "@type": "Answer", "text": "Il percorso utilizza un questionario, le fotografie del pet, tre incontri online e il lavoro svolto personalmente da Giorgia tra un incontro e l'altro." } },
          { "@type": "Question", "name": "Il mio animale deve essere presente durante gli incontri?", "acceptedAnswer": { "@type": "Answer", "text": "No. Il pet non deve partecipare alle videochiamate. Le informazioni e le fotografie richieste vengono raccolte prima del percorso." } },
          { "@type": "Question", "name": "Che cosa dovrò inviare?", "acceptedAnswer": { "@type": "Answer", "text": "Verranno richiesti il questionario compilato e alcune fotografie del pet. Non sono richieste fotografie o video del proprietario." } },
          { "@type": "Question", "name": "Quanto tempo richiede al proprietario?", "acceptedAnswer": { "@type": "Answer", "text": "Non sono richiesti un diario o aggiornamenti quotidiani. Le osservazioni vengono condivise verbalmente durante l'incontro conclusivo." } },
          { "@type": "Question", "name": "Qual è il ruolo della biorisonanza?", "acceptedAnswer": { "@type": "Answer", "text": "Giorgia utilizza il CIEM System nella fase di elaborazione personale. Il lavoro non ha finalità diagnostiche o medico-veterinarie." } },
          { "@type": "Question", "name": "ResonaPet sostituisce il veterinario?", "acceptedAnswer": { "@type": "Answer", "text": "No. ResonaPet non effettua diagnosi, prescrizioni o trattamenti medico-veterinari e non sostituisce il medico veterinario." } }
        ]
      }
    </script>
